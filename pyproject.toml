[project]
name = "multi-agent-negotiation-sim"
version = "0.1.0"
description = "Simulation lab for autonomous negotiation agents with explicit communication, rewards, and RL integration."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Antonia Research Engineering" }
]
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "gymnasium>=1.1.0,<2.0.0",
  "stable-baselines3>=2.6.0,<3.0.0",
  "langgraph>=0.2.60,<1.0.0",
  "numpy>=2.1.0,<3.0.0",
  "pandas>=2.2.0,<3.0.0",
  "orjson>=3.10.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.9.0,<1.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
